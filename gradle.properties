#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M
#Gradle
org.gradle.jvmargs=-Xmx3072M -Dfile.encoding=UTF-8
# 禁止自动探测本机 JDK：Android Studio 自带 JBR（25.0.3, JetBrains）版本/vendor 恰好满足
# gradle-daemon-jvm.properties 的 criteria，会抢在完整版 JDK 25（~/.gradle/jdks 自动下载）之前
# 被选为 daemon JVM，而精简 JBR 无 jpackage/jmods，令 compose 打包 checkRuntime 失败。
# 关闭后候选只剩当前 JVM 与自动下载的 JDK；criteria 带 toolchainUrl，无网新机仍可自动下载。
org.gradle.java.installations.auto-detect=false
org.gradle.configuration-cache=true
org.gradle.caching=true
android.useAndroidX=true
android.enableJetifier=true