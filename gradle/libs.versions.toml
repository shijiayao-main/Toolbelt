# + rag-vector（beta：EmbeddingStorage + InMemoryVectorStorageBackend + SimilaritySearchRequest）
koog-embeddingsLlm = { module = "ai.koog:embeddings-llm", version.ref = "koog" }
koog-ragVector = { module = "ai.koog:rag-vector", version.ref = "koog-rag" }
