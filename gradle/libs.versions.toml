coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil3" }
coil-network-ktor3 = { module = "io.coil-kt.coil3:coil-network-ktor3", version.ref = "coil3" }
ktor-client-cio = { module = "io.ktor:ktor-client-cio", version.ref = "ktor" }
sqlite-jdbc = { module = "org.xerial:sqlite-jdbc", version.ref = "sqlite-jdbc" }
sqldelight-runtime = { module = "app.cash.sqldelight:runtime", version.ref = "sqldelight" }
sqldelight-coroutines = { module = "app.cash.sqldelight:coroutines-extensions-jvm", version.ref = "sqldelight" }
sqldelight-driver-jvm = { module = "app.cash.sqldelight:sqlite-driver", version.ref = "sqldelight" }
# 2026-09-20 P5 MCP 外放：SDK + Ktor 显式声明（🔴 SDK 不传递 Ktor 引擎/编译期件——见 versions 节注释）
mcp-sdk-server = { module = "io.modelcontextprotocol:kotlin-sdk-server", version.ref = "mcp-sdk" }
ktor-server-cio-sdk = { module = "io.ktor:ktor-server-cio", version.ref = "ktor-sdk" }
ktor-server-core-sdk = { module = "io.ktor:ktor-server-core", version.ref = "ktor-sdk" }
# 2026-09-23 液态玻璃批 1：haze core（状态捕获/BackpropInput）+ glass（GlassStyle 折射材质）
haze-core = { module = "dev.chrisbanes.haze:haze", version.ref = "haze" }
haze-glass = { module = "dev.chrisbanes.haze:haze-glass", version.ref = "haze" }
# scrcpy 投屏 spike：JavaCV 坐标登记（javacv 引用处因 exclude 需带 lambda 走 String 记法，
# 版本统一引 versions 节；javacpp/ffmpeg 以 catalog accessor 直挂）。
# 平台 classifier jar（ffmpeg/javacpp 的 native）版本目录不支持 classifier 字段，
# 由引用处 build 脚本按 "org.bytedeco:<m>:<v>:<构建机 classifier>" 直写（版本同引 version catalog；
# classifier 随构建 OS/arch 计算，见 feature-screencast/build.gradle.kts）。
javacpp-core = { module = "org.bytedeco:javacpp", version.ref = "javacv" }
ffmpeg-binding = { module = "org.bytedeco:ffmpeg", version.ref = "ffmpegBytedeco" }

